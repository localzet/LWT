name: PHP CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: openssl, mbstring
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --strict --no-check-publish
      - name: Syntax check
        run: find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Composer autoload generation
        run: composer dump-autoload --no-interaction --optimize
      - name: Signed/encrypted token regressions
        run: php tests/security.php
